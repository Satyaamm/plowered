# docker-compose.production.yml — single-VPS Plowered deploy.
# Fully self-contained: every data plane (Postgres, Redis, NATS,
# MinIO) runs as a container in this stack.
#
# Topology:
#
#   internet
#     └─→ nginx (the only externally-exposed container; ports 80/443)
#           │     TLS termination · rate limiting · bot filtering ·
#           │     gateway-auth check · reverse proxy · load balancing
#           ├─→ plowered-web   (${WEB_DOMAIN})   — scale with --scale plowered-web=N
#           └─→ plowered-api   (${API_DOMAIN})   — scale with --scale plowered-api=N
#                  ├─→ postgres   (bundled, metadata store)
#                  ├─→ redis      (bundled, Asynq job queue)
#                  ├─→ nats       (bundled, event relay)
#                  └─→ minio      (bundled, S3-compatible object store)
#         plowered-worker → same data planes as the API
#         certbot         (webroot-based renewals)
#
# Networks:
#   public_net  — nginx + api + worker. Published ports live only on
#                 nginx; api/worker join for EGRESS (Resend/SES, LLM
#                 providers, customer warehouses) — they expose no ports.
#   private_net — internal-only bridge for service-to-service traffic.
#                 Postgres/Redis/NATS/MinIO live ONLY here: no public
#                 address, no internet egress.
#
# Load balancing: nginx resolves upstreams through Docker's embedded
# DNS (127.0.0.11) per request, so `docker compose up -d --scale
# plowered-api=3` round-robins automatically — no config change.
#
# Run:
#   ./deploy/secrets-gen.sh                      # mints .env.production
#   ./deploy/init-certs.sh you@yourdomain.com    # first run only (Let's Encrypt)
#   docker compose --env-file .env.production -f docker-compose.production.yml up -d

name: plowered

networks:
  public_net:
    driver: bridge
  private_net:
    driver: bridge
    internal: true   # no egress — keeps lateral movement contained

volumes:
  pgdata:
  redisdata:
  natsdata:
  miniodata:
  certbotetc:
  certbotwww:

services:
  # ---- Data planes ----

  # Postgres + Redis run on NON-DEFAULT ports (6543 / 7479) because the
  # VPS already has services on 5432 / 6379. Note these containers
  # publish no host ports at all (private_net only), so there's no
  # host-level collision either way — the custom ports remove all
  # ambiguity for anyone debugging on the box.

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plowered}
      POSTGRES_USER: ${POSTGRES_USER:-plowered}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: >-
      postgres
      -c port=${POSTGRES_PORT:-6543}
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c max_connections=200
      -c log_statement=ddl
      -c log_min_duration_statement=500ms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${POSTGRES_PORT:-6543} -U ${POSTGRES_USER:-plowered} -d ${POSTGRES_DB:-plowered}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [private_net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  redis:
    image: redis:7-alpine
    restart: always
    command: >-
      redis-server
      --port ${REDIS_PORT:-7479}
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-7479}", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [private_net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  nats:
    image: nats:2-alpine
    restart: always
    command: >-
      nats-server
      --jetstream
      --store_dir=/data
      --http_port=8222
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [private_net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  minio:
    # Object store for profile snapshots, AI transcripts, DSR exports.
    # To use real AWS S3 / Azure Blob / GCS instead, drop this service
    # and set PLOWERED_OBJECT_STORE_KIND + that backend's env vars.
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [private_net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  minio-init:
    # One-shot: creates the object-store bucket so the API's S3 client
    # doesn't 404 on first Put. Exits after; compose gates the API on
    # successful completion.
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/${PLOWERED_OBJECT_STORE_BUCKET:-plowered} &&
        echo "minio-init: bucket ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks: [private_net]

  # ---- Application ----

  plowered-api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
      args:
        VERSION: ${PLOWERED_VERSION:-prod}
    restart: always
    depends_on:
      postgres:   { condition: service_healthy }
      redis:      { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      PLOWERED_ENV: production
      PLOWERED_HTTP_ADDR: ":8080"
      # Bundled data planes. The API runs schema migrations against
      # this database at boot — no separate migrate step.
      PLOWERED_DATABASE_URL: "postgres://${POSTGRES_USER:-plowered}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-6543}/${POSTGRES_DB:-plowered}?sslmode=disable"
      PLOWERED_REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-7479}/0"
      PLOWERED_NATS_URL: "nats://nats:4222"
      PLOWERED_SECRETS_MASTER_KEY: ${PLOWERED_SECRETS_MASTER_KEY:?PLOWERED_SECRETS_MASTER_KEY must be set}
      PLOWERED_JWT_HS256_SECRET: ${PLOWERED_JWT_HS256_SECRET:?PLOWERED_JWT_HS256_SECRET must be set}
      # Web frontend
      PLOWERED_WEB_BASE_URL: "https://${WEB_DOMAIN:?WEB_DOMAIN must be set}"
      PLOWERED_EMAIL_PROVIDER: ${PLOWERED_EMAIL_PROVIDER:-}
      PLOWERED_EMAIL_FROM: ${PLOWERED_EMAIL_FROM}
      PLOWERED_RESEND_API_KEY: ${PLOWERED_RESEND_API_KEY:-}
      PLOWERED_SES_REGION: ${PLOWERED_SES_REGION:-}
      # Session cookies — Lax + parent-domain works because web + api
      # share the same registrable domain.
      PLOWERED_SESSION_COOKIE: ${PLOWERED_SESSION_COOKIE:-plowered_session}
      PLOWERED_SESSION_COOKIE_DOMAIN: ${PLOWERED_SESSION_COOKIE_DOMAIN:?PLOWERED_SESSION_COOKIE_DOMAIN must be set}
      PLOWERED_SESSION_COOKIE_SECURE: "1"
      PLOWERED_SESSION_COOKIE_SAMESITE: "lax"
      # CORS — exact origin only; credentialled.
      PLOWERED_CORS_ALLOWED_ORIGINS: "https://${WEB_DOMAIN}"
      PLOWERED_CORS_ALLOW_CREDENTIALS: "true"
      # Gateway-auth — nginx + the web BFF both inject this header;
      # direct hits 401 before reaching the app's auth stack.
      PLOWERED_GATEWAY_SECRET: ${PLOWERED_GATEWAY_SECRET:?PLOWERED_GATEWAY_SECRET must be set}
      # Object store (bundled MinIO by default; see service note above)
      PLOWERED_OBJECT_STORE_KIND: ${PLOWERED_OBJECT_STORE_KIND:-s3}
      PLOWERED_S3_BUCKET: ${PLOWERED_OBJECT_STORE_BUCKET:-plowered}
      PLOWERED_S3_REGION: ${PLOWERED_OBJECT_STORE_REGION:-us-east-1}
      PLOWERED_S3_ENDPOINT: "http://minio:9000"
      PLOWERED_S3_PATH_STYLE: "1"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      # Hardening + limits
      PLOWERED_MAX_BODY_BYTES: ${PLOWERED_MAX_BODY_BYTES:-2097152}
      PLOWERED_RATE_LIMIT_PER_SECOND: ${PLOWERED_RATE_LIMIT_PER_SECOND:-50}
      PLOWERED_RATE_LIMIT_BURST: ${PLOWERED_RATE_LIMIT_BURST:-100}
      PLOWERED_LOG_LEVEL: ${PLOWERED_LOG_LEVEL:-info}
    healthcheck:
      # distroless ships no shell/curl; restart policy + nginx upstream
      # failover cover liveness at the edge instead.
      disable: true
    # public_net for egress (external Postgres/Redis, email, LLMs);
    # private_net for nginx + nats + minio. No published ports.
    networks: [public_net, private_net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  plowered-worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
      args:
        VERSION: ${PLOWERED_VERSION:-prod}
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      plowered-api: { condition: service_started }
    environment:
      # Worker shares the API's data-plane env; keep in lockstep.
      PLOWERED_ENV: production
      PLOWERED_DATABASE_URL: "postgres://${POSTGRES_USER:-plowered}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-6543}/${POSTGRES_DB:-plowered}?sslmode=disable"
      PLOWERED_REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-7479}/0"
      PLOWERED_NATS_URL: "nats://nats:4222"
      PLOWERED_SECRETS_MASTER_KEY: ${PLOWERED_SECRETS_MASTER_KEY}
      PLOWERED_EMAIL_PROVIDER: ${PLOWERED_EMAIL_PROVIDER:-}
      PLOWERED_RESEND_API_KEY: ${PLOWERED_RESEND_API_KEY:-}
      PLOWERED_SES_REGION: ${PLOWERED_SES_REGION:-}
      PLOWERED_OBJECT_STORE_KIND: ${PLOWERED_OBJECT_STORE_KIND:-s3}
      PLOWERED_S3_BUCKET: ${PLOWERED_OBJECT_STORE_BUCKET:-plowered}
      PLOWERED_S3_REGION: ${PLOWERED_OBJECT_STORE_REGION:-us-east-1}
      PLOWERED_S3_ENDPOINT: "http://minio:9000"
      PLOWERED_S3_PATH_STYLE: "1"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      PLOWERED_LOG_LEVEL: ${PLOWERED_LOG_LEVEL:-info}
    networks: [public_net, private_net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  plowered-web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    restart: always
    depends_on:
      plowered-api: { condition: service_started }
    environment:
      NODE_ENV: production
      # BFF rewrite target — internal docker network only; never the
      # public API host.
      PLOWERED_API_BASE: "http://plowered-api:8080"
      # Gateway secret the middleware injects on /api/* before the
      # rewrite hits the backend. Same value the API expects.
      PLOWERED_GATEWAY_SECRET: ${PLOWERED_GATEWAY_SECRET}
    networks: [private_net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ---- Edge ----

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      plowered-web: { condition: service_started }
      plowered-api: { condition: service_started }
    ports:
      - "80:80"
      - "443:443"
    environment:
      # envsubst inputs for the vhost templates. Only these names get
      # substituted; nginx's own $variables pass through untouched.
      WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN must be set}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN must be set}
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # *.template files are rendered to /etc/nginx/conf.d/*.conf by
      # the image's entrypoint with the env above substituted.
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - certbotetc:/etc/letsencrypt:ro
      - certbotwww:/var/www/certbot
    networks: [public_net, private_net]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbotetc:/etc/letsencrypt
      - certbotwww:/var/www/certbot
    # Renewal loop: checks twice a day, re-issues within 30 days of
    # expiry. nginx picks the new cert up on its next reload (the
    # deploy hook drops a marker; reload manually or via cron:
    # docker compose exec nginx nginx -s reload).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot --webroot-path=/var/www/certbot --deploy-hook 'echo "renewed" > /var/www/certbot/.renewed' \
            || echo "[certbot] renew failed; retrying next cycle"
          sleep 12h
        done
    networks: [public_net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
