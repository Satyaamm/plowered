user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging — keep $request_time + $upstream_response_time so we
    # can attribute latency between nginx and the app container at
    # a glance.
    log_format main escape=json
        '{"ts":"$time_iso8601","ip":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"req_ms":$request_time,'
        '"upstream":"$upstream_addr","upstream_ms":"$upstream_response_time",'
        '"ua":"$http_user_agent","ref":"$http_referer",'
        '"req_id":"$http_x_request_id"}';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 25m;   # caps uploads — the API also enforces

    # gzip — text-only; nginx skips binary types automatically.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        application/x-font-ttf font/woff font/woff2 image/svg+xml;

    # Hide server fingerprint — one fewer thing for scanners to grep.
    server_tokens off;

    # Trust X-Forwarded-For only from one hop (no load balancer in
    # front). If you later put Cloudflare in front, set
    # set_real_ip_from to its egress ranges and use CF-Connecting-IP.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Rate-limit zones — two buckets per IP. Auth endpoints get a
    # tighter limit because they're the brute-force target.
    limit_req_zone $binary_remote_addr zone=zone_general:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=zone_auth:10m    rate=5r/s;

    # Map bad user agents to a flag we can return 403 on. Add to the
    # list when you see a scanner in the logs.
    map $http_user_agent $bad_bot {
        default 0;
        "~*\bnmap\b"        1;
        "~*\bsqlmap\b"      1;
        "~*\bnikto\b"       1;
        "~*\bmasscan\b"     1;
        "~*\bzgrab\b"       1;
        "~*\bcensys\b"      1;
        ""                  1;   # empty UA — almost always a probe
    }

    # Default TLS posture — Mozilla "intermediate". Wire in the actual
    # certs in each vhost.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling — lets clients skip a round-trip to the CA.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    include /etc/nginx/conf.d/*.conf;
}
