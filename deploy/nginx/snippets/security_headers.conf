# Shared security headers — included by both vhosts.
#
# The Go API already sets most of these via SecurityHeadersMW; setting
# them again at nginx is defense-in-depth (and means a static error
# page nginx serves on its own still gets the right headers).

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Disable IE compatibility view (nobody runs IE, but the header is
# cheap and stops a niche header-injection class).
add_header X-UA-Compatible "IE=edge" always;
