# Common proxy settings — included from every location that proxies
# to an upstream container. Centralised so a header tweak lands in
# one place.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "upgrade";   # allows WebSocket / SSE

# Timeouts — generous because some endpoints (migrations, /ask)
# legitimately run long; nginx falls back to 60s without this and
# 504s a healthy long poll.
proxy_connect_timeout 10s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;

# Buffering off for streaming endpoints (SSE log tail, etc). Slight
# memory cost on regular responses; cheap.
proxy_buffering off;
proxy_request_buffering off;
