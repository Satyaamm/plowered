# ploweredapi.s2datasystems.in — the backend API for direct
# (non-browser) callers: CLIs, SDK consumers, partner integrations.
#
# Browsers don't need this subdomain. They hit /api/* on the web
# vhost and the BFF rewrites to the API over the internal docker
# network with the gateway header injected. We still expose this
# subdomain for two reasons:
#   1. /openapi.yaml + /docs (Swagger UI) — useful link to share with
#      teams that want to integrate.
#   2. /healthz + /readyz + /metrics for external uptime + Prometheus.
#   3. A direct CLI/SDK path. Callers must present X-Gateway-Auth
#      themselves (nginx echoes back the right error when they don't).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ploweredapi.s2datasystems.in;

    ssl_certificate     /etc/letsencrypt/live/ploweredapi.s2datasystems.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ploweredapi.s2datasystems.in/privkey.pem;

    include /etc/nginx/snippets/security_headers.conf;

    if ($bad_bot) {
        return 403;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health + metrics — bypass the gateway gate so external probes
    # don't need the secret. The app's GATEWAY_SKIP_PATHS also skips
    # these.
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://plowered-api:8080;
    }
    location = /readyz {
        access_log off;
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://plowered-api:8080;
    }
    location = /metrics {
        # Allow only the docker private bridge (Prometheus pull
        # target). Adjust the CIDR to match your network. Returning
        # 403 to the public internet keeps the metrics surface off
        # the scanner radar.
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        access_log off;
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://plowered-api:8080;
    }

    # OpenAPI + Swagger UI — public. Useful for partners; no auth
    # required to read the spec.
    location = /openapi.yaml {
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://plowered-api:8080;
    }
    location = /docs {
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://plowered-api:8080;
    }

    # /v1/auth/* — public by definition (signup, login, verify,
    # password reset). Tighter per-IP rate limit because this is the
    # brute-force surface. The app also enforces a 5-fails-in-15min
    # account lockout.
    location ~ ^/v1/auth/ {
        limit_req zone=zone_auth burst=10 nodelay;
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://plowered-api:8080;
    }

    # Everything else: API surface. nginx demands the gateway header
    # (the API's GatewayAuthMW is a second check). Without it nginx
    # returns 401 with WWW-Authenticate; with the right header the
    # request lands at the app.
    location / {
        # General rate limit + the gateway check.
        limit_req zone=zone_general burst=60 nodelay;

        # If you'd rather have nginx inject the gateway secret from
        # an env var (instead of requiring callers to send it),
        # uncomment the next line and remove the `if` block below.
        # proxy_set_header X-Gateway-Auth $gateway_secret;

        if ($http_x_gateway_auth = "") {
            return 401 '{"error":"gateway_required","message":"this API requires X-Gateway-Auth"}';
        }

        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://plowered-api:8080;
    }

    # Custom JSON error pages — friendlier than nginx's default HTML
    # when an SDK gets back a 502.
    error_page 401 = @json_401;
    error_page 403 = @json_403;
    error_page 502 503 504 = @json_5xx;

    location @json_401 {
        default_type application/json;
        return 401 '{"error":"unauthorized","message":"gateway auth missing or invalid"}';
    }
    location @json_403 {
        default_type application/json;
        return 403 '{"error":"forbidden","message":"request rejected by edge"}';
    }
    location @json_5xx {
        default_type application/json;
        return 503 '{"error":"upstream_unavailable","message":"plowered-api is not responding; try again shortly"}';
    }
}
