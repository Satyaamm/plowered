# api.plowered.s2datasystems.com — direct API host (host-nginx edge).
# Proxies to the plowered-api container's loopback publish
# (127.0.0.1:8085). Browsers use the web vhost's /api/* BFF instead;
# this host serves CLIs/SDKs (X-Gateway-Auth required), Swagger UI,
# and uptime probes. Installed by deploy.sh into sites-available.

server {
    listen 80;
    listen [::]:80;
    server_name api.plowered.s2datasystems.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.plowered.s2datasystems.com;

    ssl_certificate     /etc/letsencrypt/live/api.plowered.s2datasystems.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.plowered.s2datasystems.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Health probes — no gateway secret needed.
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8085;
    }
    location = /readyz {
        access_log off;
        proxy_pass http://127.0.0.1:8085;
    }

    # OpenAPI + Swagger UI — public docs.
    location = /openapi.yaml { proxy_pass http://127.0.0.1:8085; }
    location = /docs         { proxy_pass http://127.0.0.1:8085; }

    # Auth endpoints — tighter per-IP limit (brute-force surface).
    location ~ ^/v1/auth/ {
        limit_req zone=plowered_auth burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8085;
    }

    # Everything else requires the gateway header; the API checks the
    # value, nginx just refuses empty ones early.
    location / {
        limit_req zone=plowered_general burst=60 nodelay;

        if ($http_x_gateway_auth = "") {
            return 401 '{"error":"gateway_required","message":"this API requires X-Gateway-Auth"}';
        }

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8085;
    }

    error_page 401 = @json_401;
    error_page 502 503 504 = @json_5xx;
    location @json_401 {
        default_type application/json;
        return 401 '{"error":"unauthorized","message":"gateway auth missing or invalid"}';
    }
    location @json_5xx {
        default_type application/json;
        return 503 '{"error":"upstream_unavailable","message":"plowered-api is not responding; try again shortly"}';
    }
}
