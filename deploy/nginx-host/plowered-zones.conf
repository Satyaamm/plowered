# Plowered rate-limit zones — http-context directives, so they live in
# /etc/nginx/conf.d/ (deploy.sh installs this file there). Zone names
# are plowered-prefixed to never collide with other apps' zones on a
# shared VPS.

limit_req_zone $binary_remote_addr zone=plowered_general:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=plowered_auth:10m    rate=5r/s;
